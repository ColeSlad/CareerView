[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "careerview"
version = "0.1.0"
description = "Terminal tracker for SWE internship openings"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.58",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
]

[project.scripts]
careerview = "careerview.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/careerview"]
