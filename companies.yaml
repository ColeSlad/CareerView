# ATS watchlist: company slug (as it appears in the provider's public job-board URL)
# mapped to a human-readable display name (Lever/Ashby don't return a company name
# in their job payloads, so we supply it here). Every slug below was verified live
# against the provider's public API before being added; a slug that goes stale just
# logs a warning and is skipped, so a bad entry degrades rather than breaks the poll.
