# Workday tenant slug -> {name, wd instance, site slug}, all taken from the company's
# own career-site URL, e.g. https://{tenant}.{wd}.myworkdayjobs.com/{site}/job/...
workday:
  autodesk:
    name: Autodesk
    wd: wd1
    site: Ext
  intel:
    name: Intel
    wd: wd1
    site: External
  micron:
    name: Micron
    wd: wd1
    site: External
  nvidia:
    name: Nvidia
    wd: wd5
    site: NVIDIAExternalCareerSite
  workday:
    name: Workday
    wd: wd5
    site: Workday

